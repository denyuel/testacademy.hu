<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1640px;
      height: 624px;
      background: radial-gradient(circle at 80% 20%, #0c4a6e 0%, #0f172a 60%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
    }

    /* Ambient glowing orbs */
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: #0284c7;
      filter: blur(140px);
      opacity: 0.25;
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #0d9488;
      filter: blur(120px);
      opacity: 0.15;
      bottom: -100px;
      left: 100px;
      pointer-events: none;
    }

    /* Subtle grid overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .header-row {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .brand-name {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-pill {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .content-center {
      position: relative;
      z-index: 10;
      max-width: 1000px;
      margin-top: 10px;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 18px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .hero-title span {
      background: linear-gradient(90deg, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 22px;
      color: #94a3b8;
      font-weight: 500;
      line-height: 1.4;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .hero-subtitle span.dot {
      color: #38bdf8;
      font-size: 28px;
    }

    .footer-row {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tags-list {
      display: flex;
      gap: 16px;
    }

    .tag-item {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .web-url {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid-overlay"></div>

  <div class="header-row">
    <div class="brand-group">
      <div class="brand-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="brand-name">TestAcademy</div>
    </div>
    <div class="brand-pill">1v1 Személyes Mentoring</div>
  </div>

  <div class="content-center">
    <h1 class="hero-title">1v1 Vibe Coding & <span>Senior QA Mentoring</span></h1>
    <div class="hero-subtitle">
      <span>Szoftverépítés kódolás nélkül</span>
      <span class="dot">•</span>
      <span>Playwright & Java Selenide</span>
      <span class="dot">•</span>
      <span>Autonóm AI Ágensek</span>
    </div>
  </div>

  <div class="footer-row">
    <div class="tags-list">
      <div class="tag-item">12+ év nemzetközi mérnöki háttér</div>
      <div class="tag-item">Google Antigravity környezet</div>
      <div class="tag-item">Fix csomagárak (0 Ft rejtett díj)</div>
    </div>
    <div class="web-url">testacademy.hu</div>
  </div>
</body>
</html>
